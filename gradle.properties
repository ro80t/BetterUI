org.gradle.jvmargs      = -Xms256M -Xmx2G

org.gradle.daemon       = true
org.gradle.parallel     = true
org.gradle.workers.max  = 8

org.gradle.configureondemand  = true
org.gradle.caching     = true

# Required by ForgeGradle 7 so a mod's compiled classes and resources
# (mods.toml, mixins config, etc.) end up in the same directory during
# `runClient`/`runServer` dev runs; without it FML sees them as two
# separate "mod files" and fails to find the mod's @Mod class.
net.minecraftforge.gradle.merge-source-sets = true
