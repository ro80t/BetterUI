plugins {
    id 'buildlogic.java-neoforge-conventions'
    id 'buildlogic.java-module-conventions'
}

evaluationDependsOn(':common:api')
evaluationDependsOn(':common:impl')
evaluationDependsOn(':common:mcoverlay-v1218')
evaluationDependsOn(':neoforge:common')

dependencies {
    implementation project(':common:api')
    implementation project(':common:impl')
    implementation project(':common:mcoverlay-v1218')
    implementation project(':neoforge:common')

    implementation libs.neoforge.api.'1218'
    annotationProcessor(variantOf(libs.mixin) { classifier('processor') })
}

jar {
    from(project(':common:api').sourceSets.main.output)
    from(project(':common:impl').sourceSets.main.output)
    from(project(':common:mcoverlay-v1218').sourceSets.main.output)
    from(project(':neoforge:common').sourceSets.main.output)
}

tasks.named('compileJava') {
    dependsOn(project(':common:mcoverlay-v1218').tasks.named('processResources'))
    dependsOn(project(':neoforge:common').tasks.named('processResources'))
}

minecraft {
    accessTransformers {
        file('src/main/resources/betterui.neoforge.common.accesstransformer')
    }
}

runs {
    client {
        modSource project.sourceSets.main
    }
}
