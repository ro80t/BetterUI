plugins {
    id 'buildlogic.java-fabric-conventions'
    id 'buildlogic.java-module-conventions'
}

evaluationDependsOn(':common:api')
evaluationDependsOn(':common:impl')
evaluationDependsOn(':fabric:common')
evaluationDependsOn(':fabric:common-legacy')

// Reference the raw (named-mapped) sourceSets output directly instead of a
// plain project(...) dependency: Loom projects publish their remapJar output
// (intermediary-mapped) as the default consumable artifact, which is binary
// incompatible with the named classes these modules were compiled against.
def fabricCommonOutput = project(':fabric:common').sourceSets.main.output
def fabricCommonLegacyOutput = project(':fabric:common-legacy').sourceSets.main.output

dependencies {
    minecraft libs.minecraft.'1192'
    mappings(variantOf(libs.fabric.yarn.'1192') {
        classifier('v2')
    })
    modImplementation libs.fabric.loader.'1192'
    modImplementation libs.fabric.api.'1192'

    implementation project(':common:api')
    implementation project(':common:impl')
    implementation fabricCommonOutput
    implementation fabricCommonLegacyOutput
}

jar {
    from(project(':common:api').sourceSets.main.output)
    from(project(':common:impl').sourceSets.main.output)
    from(project(':fabric:common').sourceSets.main.output)
    from(project(':fabric:common-legacy').sourceSets.main.output)
}
